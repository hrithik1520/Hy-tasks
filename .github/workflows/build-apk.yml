name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md", "desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # version.txt holds the release version (e.g. 1.0.0). If that release already exists,
      # the build is labelled <version>.<run number> so it never overwrites a published one.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(tr -d '[:space:]' < version.txt)
          if gh release view "v$BASE" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            V="$BASE.${{ github.run_number }}"
          else
            V="$BASE"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Fetch pinned llama.cpp
        run: scripts/fetch-llama.sh

      - name: Unit tests (core logic)
        run: ./gradlew :core:test --no-daemon

      - name: Build signed release APK
        env:
          HY_KEYSTORE_PATH: ${{ github.workspace }}/signing/hy-sideload.jks
          HY_KEYSTORE_PASSWORD: hyassistant
          HY_KEY_ALIAS: hy
          HY_KEY_PASSWORD: hyassistant
          HY_VERSION_CODE: ${{ github.run_number }}
          HY_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HyAssistant.apk
          ls -la out

      - name: Verify APK (signature + 16 KB native alignment)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose out/HyAssistant.apk | head -5
          "$BT/zipalign" -c -P 16 -v 4 out/HyAssistant.apk | tail -2
          mkdir -p so && unzip -o -q out/HyAssistant.apk 'lib/*' -d so
          for f in so/lib/*/*.so; do
            align=$(readelf -lW "$f" | awk '/LOAD/ {print $NF}' | sort -u)
            echo "$f -> $align"
            for a in $align; do [ $((a)) -ge 16384 ] || { echo "::error::$f not 16 KB aligned"; exit 1; }; done
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyAssistant-${{ env.VERSION_NAME }}
          path: out/HyAssistant.apk

      # Only the default branch publishes a release, so a push to any other branch can never
      # replace the "latest" APK that gets installed on the phone.
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Hy Assistant ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: out/HyAssistant.apk
          body: |
            Install on your phone: download **HyAssistant.apk** below, open it, and allow "Install unknown apps" for your browser/Files app when asked.
            Built from ${{ github.sha }}.
