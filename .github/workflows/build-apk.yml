name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned llama.cpp
        run: scripts/fetch-llama.sh

      - name: Unit tests (core logic)
        run: ./gradlew :core:test --no-daemon

      - name: Build signed release APK
        env:
          HY_KEYSTORE_PATH: ${{ github.workspace }}/signing/hy-sideload.jks
          HY_KEYSTORE_PASSWORD: hyassistant
          HY_KEY_ALIAS: hy
          HY_KEY_PASSWORD: hyassistant
          HY_VERSION_CODE: ${{ github.run_number }}
          HY_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HyAssistant.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: HyAssistant-${{ env.VERSION_NAME }}
          path: out/HyAssistant.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Hy Assistant ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: out/HyAssistant.apk
          body: |
            Install on your phone: download **HyAssistant.apk** below, open it, and allow "Install unknown apps" for your browser/Files app when asked.
            Built from ${{ github.sha }}.
